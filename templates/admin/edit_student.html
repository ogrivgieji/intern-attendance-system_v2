{% extends "base.html" %}

{% block title %}Edit Pelajar{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning">
                    <h5 class="mb-0"><i class="bi bi-pencil"></i> Edit Pelajar: {{ student.full_name }}</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Nama Penuh *</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" 
                                   required value="{{ student.full_name }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   required value="{{ student.email }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password Baru (optional)</label>
                            <input type="password" class="form-control" id="password" name="password" 
                                   minlength="6" placeholder="Kosongkan jika tidak mahu ubah">
                            <small class="text-muted">Isi hanya jika mahu menukar password.</small>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('admin_students') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Kembali
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save"></i> Kemaskini
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
