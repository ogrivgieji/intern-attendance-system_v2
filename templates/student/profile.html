{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-person"></i> Profil Saya</h5>
                </div>
                <div class="card-body text-center">
                    <i class="bi bi-person-circle display-1 text-primary"></i>
                    <h3 class="mt-3">{{ current_user.full_name }}</h3>
                    <p class="text-muted">{{ current_user.email }}</p>
                    <span class="badge bg-success">Pelajar Intern</span>
                    <hr>
                    <p><strong>Tarikh Daftar:</strong> {{ current_user.created_at.strftime('%d %B %Y') }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
